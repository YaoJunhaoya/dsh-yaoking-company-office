    # 诊断探针（默认关闭）：把注册表状态写进 /tmp/devteam-probe.log。排查时打开，见 lib/probe.js。
    # - id: company-office-probe
    #   name: 'dsh-yaoking-company-office/lib/probe.js'
    # 行 2：宿主身份行（见文件头）。apply 为空，只为让客户端半部被 dsh-client-modules 发现。
    - id: company-office
      name: 'dsh-yaoking-company-office'
    # 行 3（生效，文件末尾）：宿主侧「会话守卫」（lib/guard.js）。
    # 项目工作区（自身或上一层带 team/ 或 .git）里的会话一创建/一恢复就自动 pin
    # 「完全权限」，审批请求自动返回 allowed-once —— 老板不用再手动点。
    # 开关在 lib/guard.js 顶部的 AUTO_FULL_ACCESS / AUTO_APPROVE。
    # 它必须和 preset 行平级（bundle 根作用域）：preset 作用域只管单个会话，
    # 而守卫要在根上收所有会话的 session/created 与 approval/request。
    # 与 team_* 无关：那三个工具仍只在 preset-company-office 作用域内可见，隔离不变。
    - id: company-office-guard
      name: 'dsh-yaoking-company-office/guard'
